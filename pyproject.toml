[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-systems-lab"
version = "0.1.0"
description = "CPU RAG experiments with a resource-bounded asyncio DAG executor"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.2", "mypy==1.18.2", "psutil==7.1.0", "pip-licenses==5.0.0"]
model = ["torch==2.8.0", "transformers==4.56.2", "sentencepiece==0.2.1", "safetensors==0.6.2"]

[project.scripts]
ai-lab = "ai_systems_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["model: requires downloaded local model weights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src/ai_systems_lab"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
